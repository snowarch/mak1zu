name: Something is broken
description: She misbehaves, setup fails, a command errors.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mak1zu doctor`
      description: Keys and tokens are never printed by it, but look before you paste.
      render: text
  - type: input
    id: version
    attributes:
      label: Version (`mak1zu version`) and distro
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
